<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Ledger — Expansion Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a2332;
    --ink-2: #232f42;
    --ink-3: #2d3b52;
    --paper: #f7f5f0;
    --paper-2: #ffffff;
    --slate: #5b6472;
    --slate-2: #88919c;
    --border: #dcd8cd;
    --amber: #e8a13d;
    --moss: #4a7c59;
    --rust: #c1553f;
    --blue: #3b6ea5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
  code, .mono, .code { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--amber); color: var(--ink); }

  #app { min-height: 100vh; }

  /* ---------- Login ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--ink);
    background-image:
      linear-gradient(var(--ink-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--ink-2) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .login-card {
    background: var(--paper-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 48px 44px; width: 380px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .login-mark {
    width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 4px;
    background: var(--amber); display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk'; font-weight: 700; font-size: 22px; color: var(--ink);
    transform: rotate(-3deg);
  }
  .login-card h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .login-card p.sub { color: var(--slate); margin: 0 0 28px; font-size: 13px; }
  .btn-line {
    width: 100%; padding: 13px; border-radius: 3px; border: none;
    background: #06C755; color: white; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-dev {
    width: 100%; margin-top: 10px; padding: 10px; border-radius: 3px; border: 1px dashed var(--border);
    background: transparent; color: var(--slate); font-size: 12px;
  }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--ink); color: var(--paper);
    display: flex; flex-direction: column; padding: 20px 14px;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 22px; }
  .brand .mark { width: 26px; height: 26px; background: var(--amber); border-radius: 3px; transform: rotate(-4deg); }
  .brand .name { font-family: 'Space Grotesk'; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .org-switch {
    background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 4px; padding: 9px 10px;
    margin-bottom: 18px; font-size: 12px; color: var(--slate-2); cursor: pointer;
  }
  .org-switch .org-name { color: var(--paper); font-weight: 600; font-size: 13px; display: block; margin-top: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin-bottom: 2px;
    text-decoration: none; color: var(--slate-2); font-size: 13px; font-weight: 500; border-radius: 4px;
  }
  .nav a.active { background: var(--ink-2); color: var(--paper); }
  .nav a:hover { color: var(--paper); }
  .sidebar-foot { margin-top: auto; padding: 10px 6px 0; border-top: 1px solid var(--ink-3); }
  .me { display: flex; align-items: center; gap: 8px; padding-top: 12px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--slate); flex-shrink: 0; object-fit: cover; }
  .me-name { font-size: 12px; font-weight: 600; }
  .me-role { font-size: 10px; color: var(--slate-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .logout-link { font-size: 11px; color: var(--slate-2); text-decoration: underline; cursor: pointer; margin-left: auto; }

  .main { flex: 1; min-width: 0; padding: 26px 32px 60px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
  .page-head h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .page-head .sub { color: var(--slate); font-size: 13px; }

  .btn {
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 8px 14px; border-radius: 3px; font-size: 13px; font-weight: 500;
  }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.ghost { border-color: var(--border); background: transparent; color: var(--slate); }
  .btn.danger { border-color: var(--rust); background: transparent; color: var(--rust); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  /* stamp-row: signature element — a row of stage segments like permit stamps */
  .stamp-row { display: flex; gap: 3px; align-items: center; }
  .stamp {
    width: 20px; height: 6px; border-radius: 1px; background: var(--border); position: relative;
  }
  .stamp.done { background: var(--moss); }
  .stamp.current { background: var(--amber); }
  .stamp.current::after {
    content: ''; position: absolute; inset: -3px; border: 1px solid var(--amber); border-radius: 2px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 0; } }

  /* Dashboard table */
  .loc-table { width: 100%; border-collapse: collapse; }
  .loc-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--slate-2); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .loc-table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .loc-table tr:hover { background: rgba(0,0,0,0.02); cursor: pointer; }
  .loc-code { color: var(--slate-2); font-size: 11px; }
  .loc-name { font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px; color: white;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .progress-bar { width: 100px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--moss); }
  .flag-blocked { color: var(--rust); font-size: 11px; font-weight: 600; }

  /* Kanban */
  .board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 20px; }
  .col { width: 250px; flex-shrink: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .col-head .stripe { width: 10px; height: 10px; border-radius: 2px; }
  .col-head h3 { font-size: 13px; margin: 0; flex: 1; }
  .col-head .count { font-size: 11px; color: var(--slate-2); font-family: 'IBM Plex Mono'; }
  .card {
    background: var(--paper-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px; margin-bottom: 10px; cursor: pointer;
  }
  .card:hover { border-color: var(--slate-2); }
  .card .code { font-size: 10px; color: var(--slate-2); }
  .card .title { font-weight: 600; font-size: 13px; margin: 3px 0 8px; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .card .pct { font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--slate); }

  /* Location detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 300px; gap: 26px; align-items: start; }
  .stage-block { margin-bottom: 20px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .stage-block-head {
    padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;
    background: var(--paper-2);
  }
  .stage-block-head .stripe { width: 10px; height: 10px; border-radius: 2px; }
  .substep-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border);
    background: white; font-size: 13px;
  }
  .substep-row.done { color: var(--slate); }
  .substep-row.done .substep-name { text-decoration: line-through; }
  .status-select {
    font-size: 11px; border-radius: 3px; border: 1px solid var(--border); padding: 3px 6px; font-family: inherit;
    background: white;
  }
  .status-select.not_started { color: var(--slate-2); }
  .status-select.in_progress { color: var(--blue); border-color: var(--blue); }
  .status-select.done { color: var(--moss); border-color: var(--moss); }
  .status-select.blocked { color: var(--rust); border-color: var(--rust); }
  .substep-name { flex: 1; }
  .milestone-flag { font-size: 10px; color: var(--amber); }

  .side-panel { background: var(--paper-2); border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 16px; }
  .side-panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-2); margin: 0 0 12px; }
  .field-row { margin-bottom: 10px; }
  .field-row label { display: block; font-size: 11px; color: var(--slate-2); margin-bottom: 3px; }
  input, select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 3px; font-family: inherit; font-size: 13px;
    background: white; color: var(--ink);
  }
  textarea { resize: vertical; min-height: 60px; }

  .comment { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .comment .who { font-weight: 600; font-size: 11px; }
  .comment .when { color: var(--slate-2); font-size: 10px; margin-left: 6px; }
  .activity-item { font-size: 11.5px; color: var(--slate); padding: 5px 0; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,35,50,0.55); display: flex;
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal { background: var(--paper-2); border-radius: 5px; padding: 26px; width: 420px; max-width: 90vw; }
  .modal h2 { font-size: 17px; margin: 0 0 16px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .role-pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 10px;
    background: var(--paper); border: 1px solid var(--border); font-weight: 600;
  }
  .admin-section { margin-bottom: 30px; }
  .admin-section h2 { font-size: 15px; margin-bottom: 10px; }
  table.simple { width: 100%; border-collapse: collapse; }
  table.simple th { text-align: left; font-size: 11px; color: var(--slate-2); text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  table.simple td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--slate); }
  .empty-state h2 { font-size: 16px; color: var(--ink); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: white;
    padding: 10px 16px; border-radius: 4px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 860px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 14px; }
    .brand { padding: 0; margin-right: 12px; }
    .org-switch, .sidebar-foot, .nav { display: none; }
    .detail-grid { grid-template-columns: 1fr; }
    .main { padding: 18px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   Site Ledger — single-file SPA
   No build step, no framework. Hash-based router + template-literal views.
   ========================================================================= */

const state = {
  user: null,
  memberships: [],
  orgId: localStorage.getItem('currentOrgId') || null,
  pipeline: [],
  locations: [],
  members: [],
};

// ---------------------------------------------------------------- API ----
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { location.hash = '#/login'; throw new Error('not_authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'request_failed');
  return data;
}
function withOrg(path) {
  const sep = path.includes('?') ? '&' : '?';
  return `${path}${sep}orgId=${state.orgId}`;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// -------------------------------------------------------------- Router ----
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', boot);

async function boot() {
  try {
    const me = await api('GET', '/auth/me');
    state.user = me.user;
    state.memberships = me.memberships;
    if (!state.orgId && state.memberships.length) state.orgId = state.memberships[0].org_id;
    if (state.orgId) await loadOrgData();
  } catch { state.user = null; }
  if (!location.hash) location.hash = state.user ? '#/dashboard' : '#/login';
  render();
}

async function loadOrgData() {
  const [pipe, locs] = await Promise.all([
    api('GET', withOrg('/orgs/:orgId/pipeline'.replace(':orgId', state.orgId))),
    api('GET', withOrg('/orgs/:orgId/locations'.replace(':orgId', state.orgId))),
  ]);
  state.pipeline = pipe.stages;
  state.locations = locs.locations;
}

function currentMembership() {
  return state.memberships.find((m) => m.org_id === state.orgId);
}
function roleAtLeast(role, min) {
  const rank = { viewer: 1, editor: 2, manager: 3, admin: 4, owner: 5 };
  return (rank[role] || 0) >= (rank[min] || 999);
}

async function render() {
  const app = document.getElementById('app');
  const hash = location.hash || '#/login';

  if (!state.user && !hash.startsWith('#/login') && !hash.startsWith('#/join')) {
    location.hash = '#/login'; return;
  }
  if (hash.startsWith('#/login')) return renderLogin(app);
  if (hash.startsWith('#/join/')) return renderJoin(app, hash.split('/')[2]);
  if (hash.startsWith('#/accept-invite/')) return renderJoin(app, hash.split('/')[2]);

  if (!state.orgId) return renderOrgPicker(app);

  if (hash.startsWith('#/dashboard')) return renderShell(app, 'dashboard', renderDashboard);
  if (hash.startsWith('#/workspace')) return renderShell(app, 'workspace', renderWorkspace);
  if (hash.startsWith('#/location/')) return renderShell(app, 'workspace', (el) => renderLocationDetail(el, hash.split('/')[2]));
  if (hash.startsWith('#/admin')) return renderShell(app, 'admin', renderAdmin);
  if (hash.startsWith('#/orgs')) return renderOrgPicker(app);

  location.hash = '#/dashboard';
}

// -------------------------------------------------------------- Login -----
function renderLogin(app) {
  const isProd = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
  app.innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-mark">SL</div>
        <h1>Site Ledger</h1>
        <p class="sub">Track every location from scouting to grand opening.</p>
        <button class="btn-line" onclick="location.href='/auth/line/login'">
          Continue with LINE
        </button>
        ${!isProd ? `
          <button class="btn-dev" onclick="devLogin()">Dev login (no LINE credentials needed)</button>
        ` : ''}
      </div>
    </div>
  `;
}
async function devLogin() {
  const name = prompt('Dev user name (e.g. "Owen" or "Manager Chen"):', 'Owen');
  if (!name) return;
  location.href = '/auth/dev-login?name=' + encodeURIComponent(name);
}

async function renderJoin(app, code) {
  if (!state.user) {
    app.innerHTML = `
      <div class="login-screen"><div class="login-card">
        <div class="login-mark">SL</div>
        <h1>Join organization</h1>
        <p class="sub">Log in first to accept this invite.</p>
        <button class="btn-line" onclick="location.href='/auth/line/login?invite=${code}'">Continue with LINE</button>
        <button class="btn-dev" onclick="devLoginThenJoin('${code}')">Dev login</button>
      </div></div>`;
    return;
  }
  try {
    const result = await api('POST', '/auth/accept-invite', { code });
    state.orgId = result.org.id;
    localStorage.setItem('currentOrgId', state.orgId);
    const me = await api('GET', '/auth/me');
    state.memberships = me.memberships;
    await loadOrgData();
    toast(`Joined ${result.org.name}`);
    location.hash = '#/dashboard';
  } catch (e) {
    app.innerHTML = `<div class="empty-state"><h2>Invite link invalid or expired</h2><p>${e.message}</p></div>`;
  }
}
async function devLoginThenJoin(code) {
  const name = prompt('Dev user name:', 'New Teammate');
  if (!name) return;
  sessionStorage.setItem('pendingInvite', code);
  location.href = '/auth/dev-login?name=' + encodeURIComponent(name);
}

// ---------------------------------------------------------- Org picker ----
function renderOrgPicker(app) {
  app.innerHTML = `
    <div class="login-screen"><div class="login-card" style="width:440px;">
      <div class="login-mark">SL</div>
      <h1>Choose a workspace</h1>
      <p class="sub">${state.memberships.length ? 'Pick an organization or create a new one.' : 'You are not part of any organization yet.'}</p>
      <div style="text-align:left; margin-bottom: 16px;">
        ${state.memberships.map((m) => `
          <div class="card" onclick="selectOrg('${m.org_id}')" style="display:flex; justify-content:space-between; align-items:center;">
            <div><div class="title" style="margin:0;">${m.org_name}</div></div>
            <span class="role-pill">${m.role}</span>
          </div>
        `).join('') || ''}
      </div>
      <button class="btn" style="width:100%;" onclick="createOrgPrompt()">+ Create new organization</button>
    </div></div>
  `;
}
async function selectOrg(orgId) {
  state.orgId = orgId;
  localStorage.setItem('currentOrgId', orgId);
  await loadOrgData();
  location.hash = '#/dashboard';
}
async function createOrgPrompt() {
  const name = prompt('Organization name (e.g. "CRDN Fitness Expansion"):');
  if (!name) return;
  const { org } = await api('POST', '/orgs', { name });
  const me = await api('GET', '/auth/me');
  state.memberships = me.memberships;
  await selectOrg(org.id);
}

// ------------------------------------------------------------- Shell ------
function renderShell(app, activeNav, viewFn) {
  const mem = currentMembership();
  const org = state.memberships.find((m) => m.org_id === state.orgId);
  app.innerHTML = `
    <div class="shell">
      <div class="sidebar">
        <div class="brand"><div class="mark"></div><div class="name">Site Ledger</div></div>
        <div class="org-switch" onclick="location.hash='#/orgs'">
          Workspace
          <span class="org-name">${org ? org.org_name : ''}</span>
        </div>
        <div class="nav">
          <a href="#/dashboard" class="${activeNav === 'dashboard' ? 'active' : ''}">Dashboard</a>
          <a href="#/workspace" class="${activeNav === 'workspace' ? 'active' : ''}">Workspace board</a>
          ${roleAtLeast(mem.role, 'admin') ? `<a href="#/admin" class="${activeNav === 'admin' ? 'active' : ''}">Admin</a>` : ''}
        </div>
        <div class="sidebar-foot">
          <div class="me">
            <div class="avatar"></div>
            <div>
              <div class="me-name">${state.user.display_name}</div>
              <div class="me-role">${mem.role}</div>
            </div>
            <span class="logout-link" onclick="logout()">Sign out</span>
          </div>
        </div>
      </div>
      <div class="main" id="main"></div>
    </div>
  `;
  viewFn(document.getElementById('main'));
}
async function logout() {
  await api('POST', '/auth/logout');
  state.user = null; state.orgId = null;
  localStorage.removeItem('currentOrgId');
  location.hash = '#/login';
}

// ---------------------------------------------------------- Dashboard -----
async function renderDashboard(main) {
  await loadOrgData();
  const mem = currentMembership();
  const totalLocs = state.locations.length;
  const opened = state.locations.filter((l) => l.status === 'opened').length;
  const blocked = state.locations.filter((l) => l.blocked_count > 0).length;

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Dashboard</h1><div class="sub">${totalLocs} locations tracked · ${opened} opened · ${blocked} with blockers</div></div>
      ${roleAtLeast(mem.role, 'editor') ? `<button class="btn" onclick="newLocationPrompt()">+ New location</button>` : ''}
      ${roleAtLeast(mem.role, 'manager') ? `<button class="btn secondary" onclick="sendDigestNow()">Send LINE digest now</button>` : ''}
    </div>
    ${totalLocs === 0 ? `
      <div class="empty-state"><h2>No locations yet</h2><p>Add your first site to start tracking it from scouting to grand opening.</p></div>
    ` : `
      <table class="loc-table">
        <thead><tr><th>Location</th><th>Stage</th><th>Progress</th><th>Target open</th><th>Owner</th><th></th></tr></thead>
        <tbody>
          ${state.locations.map((l) => `
            <tr onclick="location.hash='#/location/${l.id}'">
              <td>
                <div class="loc-name">${l.name}</div>
                <div class="loc-code">${l.city || ''} · ${l.id.slice(-6)}</div>
              </td>
              <td><span class="badge" style="background:${l.stage_color || '#999'}"><span class="dot"></span>${l.stage_name || '—'}</span></td>
              <td>
                <div class="progress-bar"><div style="width:${l.progress_pct}%"></div></div>
                <div class="loc-code" style="margin-top:3px;">${l.progress_pct}%</div>
              </td>
              <td class="loc-code">${l.target_open_date || '—'}</td>
              <td class="loc-code">${l.owner_name || '—'}</td>
              <td>${l.blocked_count > 0 ? `<span class="flag-blocked">⚠ ${l.blocked_count} blocked</span>` : ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `}
  `;
}

async function newLocationPrompt() {
  const name = prompt('Location name (e.g. "Taichung – Xitun"):');
  if (!name) return;
  const city = prompt('City (optional):', '') || null;
  const target_open_date = prompt('Target open date (YYYY-MM-DD, optional):', '') || null;
  await api('POST', withOrg('/orgs/:orgId/locations'.replace(':orgId', state.orgId)), { name, city, target_open_date });
  toast('Location added');
  render();
}
async function sendDigestNow() {
  toast('Sending LINE digest…');
  const result = await api('POST', withOrg('/orgs/:orgId/notifications/send-now'.replace(':orgId', state.orgId)));
  toast(`Digest sent to ${result.sent_to || 0} recipient(s)`);
}

// ----------------------------------------------------------- Workspace ----
async function renderWorkspace(main) {
  await loadOrgData();
  const mem = currentMembership();
  main.innerHTML = `
    <div class="page-head">
      <div><h1>Workspace board</h1><div class="sub">All locations grouped by stage</div></div>
      ${roleAtLeast(mem.role, 'editor') ? `<button class="btn" onclick="newLocationPrompt()">+ New location</button>` : ''}
    </div>
    <div class="board">
      ${state.pipeline.map((stage) => {
        const locs = state.locations.filter((l) => l.current_stage_id === stage.id);
        return `
          <div class="col">
            <div class="col-head">
              <div class="stripe" style="background:${stage.color}"></div>
              <h3>${stage.name}</h3>
              <span class="count">${locs.length}</span>
            </div>
            ${locs.map((l) => `
              <div class="card" onclick="location.hash='#/location/${l.id}'">
                <div class="code">${l.city || ''} · ${l.id.slice(-6)}</div>
                <div class="title">${l.name}</div>
                <div class="stamp-row">
                  ${state.pipeline.map((s2) => `
                    <div class="stamp ${s2.order_index < stage.order_index ? 'done' : s2.id === stage.id ? 'current' : ''}"></div>
                  `).join('')}
                </div>
                <div class="foot">
                  <span class="pct">${l.progress_pct}%</span>
                  ${l.blocked_count > 0 ? `<span class="flag-blocked">⚠ ${l.blocked_count}</span>` : ''}
                </div>
              </div>
            `).join('') || `<div style="color:var(--slate-2); font-size:12px; padding:8px 2px;">No locations</div>`}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ------------------------------------------------------- Location detail --
async function renderLocationDetail(main, locationId) {
  const mem = currentMembership();
  const canEdit = roleAtLeast(mem.role, 'editor');
  const data = await api('GET', withOrg(`/orgs/:orgId/locations/${locationId}`.replace(':orgId', state.orgId)));
  const loc = data.location;

  main.innerHTML = `
    <div class="page-head">
      <div>
        <div class="sub" style="cursor:pointer;" onclick="location.hash='#/workspace'">← Back to workspace</div>
        <h1>${loc.name}</h1>
        <div class="sub">${loc.city || 'No city set'} · ${data.progress_pct}% complete</div>
      </div>
      ${canEdit ? `<button class="btn ghost" onclick="editLocationPrompt('${loc.id}')">Edit details</button>` : ''}
    </div>
    <div class="detail-grid">
      <div>
        ${data.pipeline.map((stage) => `
          <div class="stage-block">
            <div class="stage-block-head"><div class="stripe" style="background:${stage.color}"></div>${stage.name}</div>
            ${stage.substeps.map((s) => `
              <div class="substep-row ${s.progress && s.progress.status === 'done' ? 'done' : ''}">
                <select class="status-select ${s.progress ? s.progress.status : 'not_started'}"
                  ${canEdit ? '' : 'disabled'}
                  onchange="updateProgress('${loc.id}', '${s.id}', this.value)">
                  <option value="not_started" ${s.progress?.status === 'not_started' ? 'selected' : ''}>Not started</option>
                  <option value="in_progress" ${s.progress?.status === 'in_progress' ? 'selected' : ''}>In progress</option>
                  <option value="done" ${s.progress?.status === 'done' ? 'selected' : ''}>Done</option>
                  <option value="blocked" ${s.progress?.status === 'blocked' ? 'selected' : ''}>Blocked</option>
                </select>
                <span class="substep-name">${s.name}</span>
                ${s.is_milestone ? '<span class="milestone-flag">◆ milestone</span>' : ''}
              </div>
            `).join('')}
          </div>
        `).join('')}

        <div class="side-panel">
          <h3>Comments</h3>
          ${canEdit ? `
            <div class="field-row">
              <textarea id="new-comment" placeholder="Leave an update for the team…"></textarea>
            </div>
            <button class="btn" onclick="postComment('${loc.id}')">Post</button>
          ` : ''}
          <div style="margin-top:14px;">
            ${data.comments.map((c) => `
              <div class="comment">
                <span class="who">${c.display_name}</span><span class="when">${fmtDate(c.created_at)}</span>
                <div style="margin-top:3px;">${escapeHtml(c.body)}</div>
              </div>
            `).join('') || '<div class="sub">No comments yet.</div>'}
          </div>
        </div>
      </div>

      <div>
        <div class="side-panel">
          <h3>Details</h3>
          <div class="field-row"><label>Address</label><div>${loc.address || '—'}</div></div>
          <div class="field-row"><label>Target open date</label><div>${loc.target_open_date || '—'}</div></div>
          <div class="field-row"><label>Status</label><div>${loc.status}</div></div>
          <div class="field-row"><label>Notes</label><div>${loc.notes || '—'}</div></div>
        </div>
        <div class="side-panel">
          <h3>Activity</h3>
          ${data.activity.slice(0, 12).map((a) => `
            <div class="activity-item">${a.display_name || 'System'} — ${describeActivity(a)} <span class="mono">${fmtDate(a.created_at)}</span></div>
          `).join('') || '<div class="sub">No activity yet.</div>'}
        </div>
      </div>
    </div>
  `;
}
function describeActivity(a) {
  const map = {
    location_created: 'created this location',
    location_updated: 'updated details',
    substep_update: 'updated a checklist item',
    stage_advanced: 'advanced to the next stage',
    comment: 'left a comment',
  };
  return map[a.action] || a.action;
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso + 'Z').toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
async function updateProgress(locationId, substepId, status) {
  await api('PATCH', withOrg(`/orgs/:orgId/locations/${locationId}/progress/${substepId}`.replace(':orgId', state.orgId)), { status });
  toast('Updated');
  renderLocationDetail(document.getElementById('main'), locationId);
}
async function postComment(locationId) {
  const body = document.getElementById('new-comment').value.trim();
  if (!body) return;
  await api('POST', withOrg(`/orgs/:orgId/locations/${locationId}/comments`.replace(':orgId', state.orgId)), { body });
  renderLocationDetail(document.getElementById('main'), locationId);
}
async function editLocationPrompt(locationId) {
  const loc = state.locations.find((l) => l.id === locationId) || {};
  const name = prompt('Name:', loc.name); if (name === null) return;
  const address = prompt('Address:', loc.address || '');
  const target_open_date = prompt('Target open date (YYYY-MM-DD):', loc.target_open_date || '');
  const notes = prompt('Notes:', loc.notes || '');
  await api('PATCH', withOrg(`/orgs/:orgId/locations/${locationId}`.replace(':orgId', state.orgId)), { name, address, target_open_date, notes });
  renderLocationDetail(document.getElementById('main'), locationId);
}

// --------------------------------------------------------------- Admin ----
async function renderAdmin(main) {
  const [membersRes, pipeRes, invitesRes, settingsRes] = await Promise.all([
    api('GET', withOrg('/orgs/:orgId/members'.replace(':orgId', state.orgId))),
    api('GET', withOrg('/orgs/:orgId/pipeline'.replace(':orgId', state.orgId))),
    api('GET', withOrg('/orgs/:orgId/invites'.replace(':orgId', state.orgId))),
    api('GET', withOrg('/orgs/:orgId/notification-settings'.replace(':orgId', state.orgId))),
  ]);
  const s = settingsRes.settings;

  main.innerHTML = `
    <div class="page-head"><div><h1>Admin</h1><div class="sub">Members, pipeline, and notifications for this workspace</div></div></div>

    <div class="admin-section">
      <h2>Members</h2>
      <table class="simple">
        <thead><tr><th>Name</th><th>Role</th><th>LINE digest</th><th></th></tr></thead>
        <tbody>
          ${membersRes.members.map((m) => `
            <tr>
              <td>${m.display_name}</td>
              <td>
                <select onchange="changeRole('${m.id}', this.value)" class="status-select">
                  ${['viewer','editor','manager','admin','owner'].map((r) => `<option value="${r}" ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}
                </select>
              </td>
              <td><input type="checkbox" ${m.notify_progress ? 'checked' : ''} onchange="toggleNotify('${m.id}', this.checked)"></td>
              <td><span class="btn danger" style="padding:4px 8px; font-size:11px;" onclick="removeMember('${m.id}')">Remove</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:12px;">
        <button class="btn secondary" onclick="createInvite()">+ Create invite link</button>
      </div>
      ${invitesRes.invites.length ? `
        <div style="margin-top:10px;">
          ${invitesRes.invites.map((i) => `
            <div class="sub mono" style="margin-bottom:4px;">
              ${i.role} · code: ${i.code} ${i.used_by ? '(used)' : `(expires ${new Date(i.expires_at).toLocaleDateString()})`}
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>

    <div class="admin-section">
      <h2>Pipeline</h2>
      <div class="sub" style="margin-bottom:10px;">Stages and checklist items shown on every location. Changes apply immediately across the workspace.</div>
      ${pipeRes.stages.map((stage) => `
        <div class="stage-block">
          <div class="stage-block-head"><div class="stripe" style="background:${stage.color}"></div>${stage.name}
            <span class="btn ghost" style="margin-left:auto; padding:3px 8px; font-size:11px;" onclick="addSubstep('${stage.id}')">+ Add item</span>
          </div>
          ${stage.substeps.map((s) => `
            <div class="substep-row">
              <span class="substep-name">${s.name}</span>
              ${s.is_milestone ? '<span class="milestone-flag">◆</span>' : ''}
              <span class="btn danger" style="padding:2px 6px; font-size:10px;" onclick="deleteSubstep('${s.id}')">Remove</span>
            </div>
          `).join('')}
        </div>
      `).join('')}
      <button class="btn secondary" onclick="addStage()">+ Add stage</button>
    </div>

    <div class="admin-section">
      <h2>LINE notifications</h2>
      <div class="field-row" style="max-width:320px;">
        <label>Frequency</label>
        <select onchange="updateSchedule({frequency: this.value})">
          <option value="daily" ${s.frequency === 'daily' ? 'selected' : ''}>Daily</option>
          <option value="weekly" ${s.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
        </select>
      </div>
      ${s.frequency === 'weekly' ? `
        <div class="field-row" style="max-width:320px;">
          <label>Day of week</label>
          <select onchange="updateSchedule({day_of_week: Number(this.value)})">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d, i) => `<option value="${i}" ${s.day_of_week === i ? 'selected' : ''}>${d}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="field-row" style="max-width:320px;">
        <label>Hour (Asia/Taipei, 24h)</label>
        <input type="number" min="0" max="23" value="${s.hour_local}" onchange="updateSchedule({hour_local: Number(this.value)})">
      </div>
      <div class="sub">Toggle each member's "LINE digest" checkbox above to control who receives it.</div>
    </div>
  `;
}
async function changeRole(userId, role) {
  await api('PATCH', withOrg(`/orgs/:orgId/members/${userId}`.replace(':orgId', state.orgId)), { role });
  toast('Role updated'); render();
}
async function toggleNotify(userId, checked) {
  await api('PATCH', withOrg(`/orgs/:orgId/members/${userId}`.replace(':orgId', state.orgId)), { notify_progress: checked ? 1 : 0 });
  toast('Preference saved');
}
async function removeMember(userId) {
  if (!confirm('Remove this member from the organization?')) return;
  await api('DELETE', withOrg(`/orgs/:orgId/members/${userId}`.replace(':orgId', state.orgId)));
  render();
}
async function createInvite() {
  const role = prompt('Role for invitee (viewer / editor / manager / admin):', 'editor');
  if (!role) return;
  const { invite } = await api('POST', withOrg('/orgs/:orgId/invites'.replace(':orgId', state.orgId)), { role });
  prompt('Share this invite link:', location.origin + invite.url);
  render();
}
async function addStage() {
  const name = prompt('Stage name:');
  if (!name) return;
  await api('POST', withOrg('/orgs/:orgId/stages'.replace(':orgId', state.orgId)), { name });
  render();
}
async function addSubstep(stageId) {
  const name = prompt('Checklist item name:');
  if (!name) return;
  const isMilestone = confirm('Mark as a milestone?');
  await api('POST', withOrg(`/orgs/:orgId/stages/${stageId}/substeps`.replace(':orgId', state.orgId)), { name, is_milestone: isMilestone ? 1 : 0 });
  render();
}
async function deleteSubstep(substepId) {
  if (!confirm('Remove this checklist item? Progress on it will be lost.')) return;
  await api('DELETE', withOrg(`/orgs/:orgId/substeps/${substepId}`.replace(':orgId', state.orgId)));
  render();
}
async function updateSchedule(patch) {
  await api('PATCH', withOrg('/orgs/:orgId/notification-settings'.replace(':orgId', state.orgId)), patch);
  toast('Schedule saved'); render();
}
</script>
</body>
</html>
