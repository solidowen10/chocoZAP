<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chocoZAP Taiwan Location Review</title>
<link rel="icon" type="image/png" href="/assets/choco-logo.png">
<link rel="apple-touch-icon" href="/assets/choco-logo.png">
<style>
.address-box{
  margin-top:14px;
  margin-bottom:16px;
  padding:14px 16px;
  background:#f8f8f6;
  border-radius:14px;
  line-height:1.55;
}

.address-box small{
  display:block;
  color:#888;
  font-size:12px;
  margin-bottom:5px;
}

.address-box div{
  font-size:14px;
  font-weight:700;
  color:#222;
  word-break:break-word;
}

.address-box a{
  display:inline-block;
  margin-top:8px;
  font-size:13px;
  color:#0a66c2;
  text-decoration:none;
  font-weight:700;
}

.address-box a:hover{
  text-decoration:underline;
}

:root{
  --bg:#f5f5f3;
  --card:#fff;
  --text:#171717;
  --muted:#777;
  --line:#e8e8e5;
  --green:#0aa66f;
  --yellow:#d99b00;
  --red:#d84a4a;
  --orange:#ff5a36;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1280px;margin:auto;padding:42px 22px 80px}
.header-brand{
  display:flex;
  align-items:center;
  gap:40px;
  margin-bottom:36px;
}

.header-brand h1{
  margin:0;
  font-size:42px;
  letter-spacing:2px;
}

.header-divider{
  height:1px;
  background:#ddd;
  margin-bottom:28px;
}

.source-nav{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:28px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:#777;
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
}

.brand img{
  width:150px;
  height:auto;
  display:block;
  object-fit:contain;
}

.brand span{
  padding-left:0;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:28px;
  font-weight:800;
  letter-spacing:4px;
  line-height:1;
}
h1{font-size:34px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 20px}
.tab{
  border:1px solid var(--line);
  background:#fff;
  color:#111;
  padding:10px 18px;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
}
.tab.active{background:#111;color:#fff}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:22px;
}
.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:0 3px 14px rgba(0,0,0,.035);
}
.card-address{
  margin-top:14px;
  font-size:14px;
  font-weight:750;
  color:#222;
  line-height:1.5;
}

.map-link{
  display:inline-block;
  margin-top:5px;
  color:#0969da;
  font-size:13px;
  font-weight:750;
  text-decoration:none;
}

.map-link:hover{
  text-decoration:underline;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}
.name{font-size:22px;font-weight:900}
.region{font-size:13px;color:var(--muted);margin-top:4px}

.score{
  width:72px;height:72px;border-radius:50%;
  color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-weight:900;flex:none;
}
.score strong{font-size:23px;line-height:1}
.score span{font-size:10px;margin-top:4px}
.green{background:var(--green)}
.yellow{background:var(--yellow)}
.red{background:var(--red)}

.meta{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:16px 0;
  margin:18px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.meta small{display:block;color:var(--muted);margin-bottom:4px}
.meta strong{font-size:14px}

.scores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:4px;
}
.map-wrap{
  margin-top:18px;
  width:100%;
  height:260px;
  overflow:hidden;
  border-radius:16px;
  background:#eee;
}

.map-wrap iframe{
  width:100%;
  height:100%;
  border:0;
}
.scorebox{
  background:#f8f8f6;
  border-radius:14px;
  padding:14px;
}
.scorebox small{display:block;color:var(--muted);margin-top:3px}
.scorebox b{font-size:17px}

.tag{
  display:inline-block;
  padding:6px 10px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  margin-top:14px;
}
.tag.green{background:#dcf5eb;color:#087b55}
.tag.yellow{background:#fff0c4;color:#8c6500}
.tag.red{background:#fde1e1;color:#a83232}

.detail{margin-top:14px;font-size:14px;line-height:1.65}
.detail b{display:block;margin-top:9px}
.detail div{color:#666}

.footer-note{
  margin-top:28px;
  color:#888;
  font-size:12px;
  line-height:1.6;
}

.source-nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:24px 0 18px;
}

.source-tab{
  border:1px solid var(--line);
  background:#fff;
  color:#222;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:900;
}

.source-tab.active{
  background:#111;
  color:#fff;
}

.toolbar{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  margin:0 0 18px;
  align-items:end;
}

.toolbar label,
.rules-grid label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin-bottom:5px;
}

.toolbar input,
.toolbar select,
.rules-grid input,
.rules-grid select{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 10px;
  background:#fff;
  color:#222;
  font:inherit;
  font-size:13px;
}

.listing-card{
  display:grid;
  grid-template-columns:160px minmax(0,1fr);
  gap:16px;
  align-items:start;
}

.listing-thumb{
  width:160px;
  aspect-ratio:4/3;
  border-radius:10px;
  background:#eee;
  object-fit:cover;
}

.listing-thumb.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:12px;
  font-weight:800;
}

.listing-title{
  font-size:18px;
  font-weight:950;
  line-height:1.35;
}

.listing-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.auto-meta{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:14px;
}

.auto-meta div{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px;
  background:#fafaf8;
}

.auto-meta small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
}

.auto-meta strong{
  display:block;
  font-size:13px;
  word-break:break-word;
}

.review-line{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:12px;
  font-weight:900;
  background:#eee;
  color:#333;
}

.pill.recommend_viewing{background:#dcf5eb;color:#087b55}
.pill.needs_research{background:#fff0c4;color:#8c6500}
.pill.hold{background:#e8eef7;color:#315d91}
.pill.reject{background:#fde1e1;color:#a83232}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.small-btn{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  padding:8px 11px;
  font-weight:900;
  cursor:pointer;
}

.small-btn.primary{
  border-color:#111;
  background:#111;
  color:#fff;
}

.rules-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

.rule-section{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

.rule-section h2{
  margin:0 0 12px;
  font-size:16px;
}

.rule-section .field{
  margin-bottom:10px;
}

.check-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:800;
}

.check-row input{
  width:auto;
}

.sync-note{
  color:var(--muted);
  font-size:12px;
  margin:8px 0 18px;
  line-height:1.6;
}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .meta{grid-template-columns:repeat(2,1fr)}
  .scores{grid-template-columns:1fr}
  .toolbar{grid-template-columns:repeat(2,1fr)}
  .listing-card{grid-template-columns:1fr}
  .listing-thumb{width:100%}
  .auto-meta{grid-template-columns:repeat(2,1fr)}
  .review-line{grid-template-columns:1fr}
  .rules-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header-brand">
    <div class="brand">
      <img src="/assets/choco-logo.png" alt="chocoZAP">
      <span>臺灣</span>
    </div>
    <h1>展店物件評估系統</h1>
  </div>

  <div class="header-divider"></div>

  <div class="source-nav">
    <button class="source-tab active" data-source-view="manual">Manual Research / 人工蒐集</button>
    <button class="source-tab" data-source-view="automated">Automated Listings / 自動蒐集</button>
    <button class="source-tab" data-source-view="rules">Scoring Rules / 評分規則</button>
  </div>

  <section id="manualView">
    <div class="sync-note sync-row" id="manualUpdatedInfo">
      <button class="sync-btn" onclick="syncManualSheet()">
        同步 Google Sheet
      </button>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-region="全部">全部</button>
      <button class="tab" data-region="台北">台北</button>
      <button class="tab" data-region="新北">新北</button>
    </div>

    <div class="toolbar" id="manualFilters"></div>

    <div class="summary">
      <div class="stat queue-stat" data-manual-status="">
        <b id="countAll">0</b><span>全部</span>
      </div>
      <div class="stat queue-stat" data-manual-status="high">
        <b id="countHigh">0</b><span>高分物件</span>
      </div>
      <div class="stat queue-stat" data-manual-status="missing">
        <b id="countCheck">0</b><span>待補資料</span>
      </div>
      <div class="stat queue-stat" data-manual-status="rejected">
        <b id="countReject">0</b><span>已淘汰</span>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="footer-note">
      AI 評分＝依 chocoZAP Taiwan 展店條件、物件風險與營運條件綜合評估。<br>
      chocoZAP 評分＝依 chocoZAP 官方物件評分標準計算。<br>
      人工評分＝原始物件表內紀錄之評價，若原表無評分者則不顯示。
    </div>
  </section>

  <section id="automatedView" hidden>
    <div class="sync-note" id="autoUpdatedInfo">自動蒐集資料載入中...</div>
    <div class="toolbar" id="autoFilters"></div>
    <div class="summary">
      <div class="stat"><b id="autoCountAll">0</b><span>自動物件</span></div>
      <div class="stat"><b id="autoCountRecommend">0</b><span>建議看屋</span></div>
      <div class="stat"><b id="autoCountMissing">0</b><span>缺資料</span></div>
      <div class="stat"><b id="autoCountRejected">0</b><span>淘汰 / 封存</span></div>
    </div>
    <div id="autoGrid" class="grid"></div>
  </section>

  <section id="rulesView" hidden>
    <div class="sync-note">
      調整規則後儲存，人工與自動物件會用同一套 Unified Scoring v1 重新計算。
    </div>
    <div id="rulesForm" class="rules-grid"></div>
  </section>
</div>

<script>
function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

let locations = [];
let currentRegion = "全部";
let sourceView = "manual";
let automatedListings = [];
let scoringConfig = null;
let propertySyncToken = localStorage.getItem("propertySyncToken") || "";
const manualFilters = {
  city: "",
  district: "",
  status: "",
  scoreMin: ""
};

const autoFilters = {
  city: "",
  district: "",
  status: "",
  rentMax: "",
  listedAreaMin: "",
  scoreMin: ""
};

async function loadLocations() {
  const grid = document.getElementById("grid");

  try {
    grid.innerHTML = `
      <div style="padding:30px;color:#777;">
        載入物件資料中...
      </div>
    `;

    const res = await fetch('/api/location-report', {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();

    const mainLocations = Array.isArray(data.locations)
  ? data.locations
  : [];

const reviewOnly = Array.isArray(data.reviewOnly)
  ? data.reviewOnly
  : [];

locations = [
  ...mainLocations.map(normalizeManualLocation),
  ...reviewOnly.map(x => ({
    ...normalizeManualLocation(x),
    aiScore: x.aiScore ?? 0,
    status: x.status || '審查中',
    risk: x.risk || '審查表獨有物件，待補完整評估',
    missing: x.missing || '待補主物件資料',
    next: x.next || '先確認完整物件資料與是否納入主表'
  }))
];

    const updated = document.getElementById("updatedInfo");

    if (updated) {
      updated.textContent =
        `最後更新：${formatDate(data.updatedAt)} ｜ ${data.updatedBy || "—"}`;
    }

    refreshRegionTabs();
    await loadAutomatedListings();
    renderSourceView();

  } catch (err) {
    console.error(err);

    grid.innerHTML = `
      <div style="
        background:#fff;
        border-radius:16px;
        padding:24px;
        color:#b42318;
      ">
        無法載入物件資料
      </div>
    `;
  }
}

async function loadAutomatedListings() {
  const info = document.getElementById("autoUpdatedInfo");

  try {
    const res = await fetch('/api/property-sourcing', {
      cache: 'no-store'
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    automatedListings = Array.isArray(data.listings) ? data.listings : [];
    scoringConfig = data.scoringConfig || scoringConfig;

    if (info) {
      info.textContent =
        `Google Sheet 自動蒐集資料：${automatedListings.length} 筆 ｜ 最後同步：${formatDate(data.updatedAt)} ｜ ${data.updatedBy || "—"}`;
    }
  } catch (err) {
    console.error(err);
    automatedListings = [];
    if (info) {
      info.textContent = "無法載入自動蒐集資料。請先同步 Google Sheet。";
    }
  }
}

function normalizeManualLocation(x) {
  const text = `${x.region || ""} ${x.address || ""} ${x.station || ""}`;

  let city = "";
  let region = x.region || "";

  const cityRules = [
    ["台北市", "台北", /台北|臺北|Taipei/i],
    ["新北市", "新北", /新北|New Taipei/i],
    ["桃園市", "桃園", /桃園|Taoyuan/i],
    ["新竹縣", "竹北", /竹北|新竹縣|Hsinchu County|Hsinchu/i],
    ["台中市", "台中", /台中|臺中|Taichung/i],
    ["台南市", "台南", /台南|臺南|Tainan/i],
    ["高雄市", "高雄", /高雄|Kaohsiung/i]
  ];

  for (const [cityName, regionName, regex] of cityRules) {
    if (regex.test(text)) {
      city = cityName;
      if (!region) region = regionName;
      break;
    }
  }

  const districtRules = [
    ["大安區", /大安區|Da.?an District/i],
    ["信義區", /信義區|Xinyi District/i],
    ["中山區", /中山區|Zhongshan District|Chungshan District/i],
    ["松山區", /松山區|Songshan District/i],
    ["士林區", /士林區|Shilin District/i],
    ["北投區", /北投區|Beitou District/i],
    ["內湖區", /內湖區|Neihu District/i],
    ["南港區", /南港區|Nangang District/i],
    ["萬華區", /萬華區|Wanhua District/i],
    ["文山區", /文山區|Wenshan District/i],
    ["中正區", /中正區|Zhongzheng District/i],

    ["板橋區", /板橋區|Banqiao District/i],
    ["三重區", /三重區|Sanchong District/i],
    ["新店區", /新店區|Xindian District/i],
    ["中和區", /中和區|Zhonghe District/i],
    ["永和區", /永和區|Yonghe District/i],

    ["中壢區", /中壢區|Zhongli District/i],
    ["桃園區", /桃園區|Taoyuan District/i],

    ["竹北市", /竹北市|Zhubei/i],

    ["西屯區", /西屯區|Xitun District/i],
    ["北屯區", /北屯區|Beitun District/i],
    ["南屯區", /南屯區|Nantun District/i],

    ["東區", /東區|East District/i],
    ["安平區", /安平區|Anping District/i],

    ["左營區", /左營區|Zuoying District/i],
    ["苓雅區", /苓雅區|Lingya District/i]
    
    ["林口區", /林口區|Linkou District/i],
["龜山區", /龜山區|Guishan District/i],
["蘆竹區", /蘆竹區|Luzhu District/i],
["大園區", /大園區|Dayuan District/i],
["平鎮區", /平鎮區|Pingzhen District/i],
["楊梅區", /楊梅區|Yangmei District/i],
["八德區", /八德區|Bade District/i],

["沙鹿區", /沙鹿區|Shalu District/i],
["大里區", /大里區|Dali District/i],
["西區", /西區|West District/i],

["東區", /東區|East District/i],
["南區", /南區|South District/i],

["左營區", /左營區|Zuoying District/i],
["苓雅區", /苓雅區|Lingya District/i]
  ];

  let district = "";

  for (const rule of districtRules) {
    if (!Array.isArray(rule)) continue;

    const name = rule[0];
    const regex = rule[1];

    if (regex && regex.test(text)) {
      district = name;
      break;
    }
  }
  
  if (!district) {
  const stationRules = [
    // 台北市
    ["信義區", /市政府|象山|永春|信義安和/i],
    ["大安區", /大安|科技大樓|古亭/i],
    ["中山區", /中山|雙連|民權西路|劍南路/i],
    ["松山區", /南京復興|松山|小巨蛋/i],
    ["士林區", /士林|芝山|明德/i],
    ["北投區", /石牌|北投/i],
    ["內湖區", /內湖|文德/i],
    ["南港區", /南港|昆陽|南港展覽館/i],

    // 新北市
    ["板橋區", /板橋|府中/i],
    ["三重區", /三重|菜寮/i],
    ["新店區", /新店/i],
    ["中和區", /中和/i],
    ["永和區", /永和|永安市場/i],
    ["林口區", /林口/i],

    // 桃園市
    ["中壢區", /A18|高鐵桃園|桃園高鐵|中壢|環北|老街溪/i],
    ["桃園區", /桃園站|桃園火車站/i],

    // 台南市

    ["安平區", /安平/i],

    // 高雄市
    ["左營區", /左營|高鐵左營/i],
    ["苓雅區", /苓雅/i],
    ["三民區", /三民/i],
    ["鼓山區", /鼓山/i]
  ];

  for (const [name, regex] of stationRules) {
    if (regex.test(text)) {
      district = name;
      break;
    }
  }
}
  return {
  ...x,
  region,
  city,
  district: district || "待確認"
};
}
function shortAddress(address = "") {
  let s = String(address).trim();

  if (!s) return "地址待確認";

  // 移除郵遞區號 / 國家 / 城市名稱
  s = s
    .replace(/^\d{3,6}/, "")
    .replace(/臺北市|台北市|新北市|桃園市|新竹縣|新竹市|臺中市|台中市|臺南市|台南市|高雄市/g, "")
    .replace(/,\s*臺灣.*$/i, "")
    .replace(/,\s*台湾.*$/i, "")
    .trim();

  // Nominatim 格式：46號, 中原街, 中原里, 中山區, ...
  if (s.includes(",")) {
    const parts = s
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);

    const districtIndex = parts.findIndex(x =>
      /區$|市$|鄉$|鎮$/.test(x)
    );

    if (districtIndex >= 0) {
      const district = parts[districtIndex];

      const before = parts
        .slice(0, districtIndex)
        .filter(x => !/里$|村$|商圈$/.test(x));

      return district + before.reverse().join("");
    }
  }

  return s.replace(/,/g, "");
}

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return new Intl.DateTimeFormat('zh-TW', {
    year:'numeric',
    month:'2-digit',
    day:'2-digit',
    hour:'2-digit',
    minute:'2-digit'
  }).format(date);
}

function getPropertyToken() {
  if (propertySyncToken) return propertySyncToken;
  const token = prompt("請輸入 LOCATION_SYNC_TOKEN 以寫入 / 同步資料：", "");
  if (!token) return "";
  propertySyncToken = token;
  localStorage.setItem("propertySyncToken", token);
  return token;
}

async function propertyWriteApi(method, path, body) {
  const request = (token) => fetch(path, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": `Bearer ${token}` } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });

  let res = await request(propertySyncToken);
  if (res.status === 401) {
    propertySyncToken = "";
    localStorage.removeItem("propertySyncToken");
    const token = getPropertyToken();
    if (!token) throw new Error("需要 LOCATION_SYNC_TOKEN");
    res = await request(token);
  }

  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    propertySyncToken = "";
    localStorage.removeItem("propertySyncToken");
    throw new Error("Token 無效，請重新輸入");
  }
  if (!res.ok) throw new Error(data.error || "request_failed");
  return data;
}

async function syncPropertySheet() {
  try {
    await propertyWriteApi("POST", "/api/property-sourcing/sheet-sync", {});
    await loadAutomatedListings();
    renderAutomatedListings();
    alert("已從 Google Sheet 同步自動物件");
  } catch (err) {
    alert(err.message || "同步失敗");
  }
}

async function syncManualSheet() {
  const btn = document.querySelector('[onclick="syncManualSheet()"]');

  if (btn) {
    btn.disabled = true;
    btn.textContent = "同步中...";
  }

  try {
    const res = await fetch('/api/location-sheet-sync', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${propertySyncToken}`
      }
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    await loadLocations();

    if (btn) {
      btn.textContent = "同步完成";
    }

    alert("已同步人工蒐集 Google Sheet");

    setTimeout(() => {
      if (btn) {
        btn.textContent = "同步 Google Sheet";
        btn.disabled = false;
      }
    }, 2000);

  } catch (err) {
    if (btn) {
      btn.textContent = "同步失敗";
      btn.disabled = false;
    }

    alert(err.message || "同步失敗");
  }
}
async function patchAutomatedStatus(encodedIdentity, status) {
  const { source, sourceListingId } = splitSourceId(encodedIdentity);
  try {
    await propertyWriteApi("PATCH", `/api/property-sourcing/listings/${encodeURIComponent(source)}/${encodeURIComponent(sourceListingId)}`, { status });
    await loadAutomatedListings();
    renderAutomatedListings();
  } catch (err) {
    alert(err.message || "更新失敗");
  }
}

async function promoteToLocationReview(encodedIdentity) {
  const { source, sourceListingId } = splitSourceId(encodedIdentity);
  try {
    await propertyWriteApi("POST", `/api/property-sourcing/listings/${encodeURIComponent(source)}/${encodeURIComponent(sourceListingId)}/promote`, { status: "shortlisted" });
    await Promise.all([loadLocations(), loadAutomatedListings()]);
    sourceView = "manual";
    document.querySelectorAll(".source-tab")
      .forEach(btn => btn.classList.toggle("active", btn.dataset.sourceView === "manual"));
    renderSourceView();
    alert("已送到 Location Review");
  } catch (err) {
    alert(err.message || "送出失敗");
  }
}

function boolChecked(value) {
  return value ? "checked" : "";
}

function cfg(path, fallback = "") {
  return path.split(".").reduce((obj, key) => obj && obj[key], scoringConfig) ?? fallback;
}

function renderScoringRules() {
  document.getElementById("rulesForm").innerHTML = `
    <div class="rule-section">
      <h2>推薦門檻</h2>
      <div class="field">
        <label>score ≥</label>
        <input id="ruleThreshold" type="number" min="0" max="10" step="0.5" value="${cfg("recommendation_threshold", 8)}">
      </div>
      <div class="field">
        <label>優先城市（逗號分隔）</label>
        <input id="rulePreferredCities" value="${escapeHtml((cfg("city_location.preferred_cities", []) || []).join(","))}">
      </div>
      <div class="field">
        <label>優先行政區（逗號分隔）</label>
        <input id="rulePreferredDistricts" value="${escapeHtml((cfg("city_location.preferred_districts", []) || []).join(","))}">
      </div>
      <div class="field"><label>城市分數</label><input id="ruleCityPoints" type="number" min="0" max="2" step="0.1" value="${cfg("city_location.city_points", 1)}"></div>
      <div class="field"><label>行政區加分</label><input id="ruleDistrictBonus" type="number" min="0" max="2" step="0.1" value="${cfg("city_location.district_bonus_points", 1)}"></div>
    </div>

    <div class="rule-section">
      <h2>總坪數</h2>
      <div class="field"><label>好物件總坪數下限</label><input id="ruleAreaGoodMin" type="number" min="0" value="${cfg("area.good_min_ping", 80)}"></div>
      <div class="field"><label>好物件總坪數上限</label><input id="ruleAreaGoodMax" type="number" min="0" value="${cfg("area.good_max_ping", 160)}"></div>
      <div class="field"><label>可接受總坪數下限</label><input id="ruleAreaOkMin" type="number" min="0" value="${cfg("area.ok_min_ping", 60)}"></div>
      <div class="field"><label>好物件總坪數分數</label><input id="ruleAreaGoodPoints" type="number" min="0" max="3" step="0.1" value="${cfg("area.good_points", 3)}"></div>
      <div class="field"><label>可接受總坪數分數</label><input id="ruleAreaOkPoints" type="number" min="0" max="3" step="0.1" value="${cfg("area.ok_points", 1.5)}"></div>
      <div class="field"><label>偏小總坪數分數</label><input id="ruleAreaLowPoints" type="number" min="0" max="3" step="0.1" value="${cfg("area.low_points", 0)}"></div>
    </div>

    <div class="rule-section">
      <h2>租金</h2>
      <div class="field"><label>租金佳上限 TWD</label><input id="ruleRentGoodMax" type="number" value="${cfg("rent.good_max_twd", 120000)}"></div>
      <div class="field"><label>租金可接受上限 TWD</label><input id="ruleRentOkMax" type="number" value="${cfg("rent.ok_max_twd", 200000)}"></div>
      <div class="field"><label>租金佳分數</label><input id="ruleRentGoodPoints" type="number" min="0" max="2.5" step="0.1" value="${cfg("rent.good_points", 2.5)}"></div>
      <div class="field"><label>租金可接受分數</label><input id="ruleRentOkPoints" type="number" min="0" max="2.5" step="0.1" value="${cfg("rent.ok_points", 1.2)}"></div>
      <div class="field"><label>租金偏高分數</label><input id="ruleRentHighPoints" type="number" min="0" max="2.5" step="0.1" value="${cfg("rent.high_points", 0)}"></div>
    </div>

    <div class="rule-section">
      <h2>樓層</h2>
      <div class="field"><label>純 1F 分數</label><input id="ruleFloor1F" type="number" min="0" max="2.5" step="0.1" value="${cfg("floor.ground_floor_points", 2.5)}"></div>
      <div class="field"><label>1F+2F 分數</label><input id="ruleFloor1F2F" type="number" min="0" max="2.5" step="0.1" value="${cfg("floor.ground_plus_second_points", 2)}"></div>
      <div class="field"><label>1F+B1 分數</label><input id="ruleFloor1FB1" type="number" min="0" max="2.5" step="0.1" value="${cfg("floor.ground_plus_basement_points", 1.8)}"></div>
      <div class="field"><label>2F 分數</label><input id="ruleFloor2F" type="number" min="0" max="2.5" step="0.1" value="${cfg("floor.second_floor_points", 1)}"></div>
    </div>

    <div class="rule-section">
      <h2>儲存</h2>
      <div class="sync-note">總分上限：城市 / 區域 2.0、總坪數 3.0、租金 2.5、樓層 2.5。</div>
      <button class="small-btn primary" onclick="saveScoringRules()">儲存評分規則</button>
      <button class="small-btn" onclick="resetScoringRules()">Reset to Defaults</button>
    </div>
  `;
}

function numberInput(id) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : 0;
}

function csvInput(id) {
  return document.getElementById(id).value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);
}

function readScoringRulesForm() {
  return {
    recommendation_threshold: numberInput("ruleThreshold"),
    city_location: {
      preferred_cities: csvInput("rulePreferredCities"),
      preferred_districts: csvInput("rulePreferredDistricts"),
      city_points: numberInput("ruleCityPoints"),
      district_bonus_points: numberInput("ruleDistrictBonus")
    },
    area: {
      good_min_ping: numberInput("ruleAreaGoodMin"),
      good_max_ping: numberInput("ruleAreaGoodMax"),
      ok_min_ping: numberInput("ruleAreaOkMin"),
      good_points: numberInput("ruleAreaGoodPoints"),
      ok_points: numberInput("ruleAreaOkPoints"),
      low_points: numberInput("ruleAreaLowPoints")
    },
    rent: {
      good_max_twd: numberInput("ruleRentGoodMax"),
      ok_max_twd: numberInput("ruleRentOkMax"),
      good_points: numberInput("ruleRentGoodPoints"),
      ok_points: numberInput("ruleRentOkPoints"),
      high_points: numberInput("ruleRentHighPoints")
    },
    floor: {
      ground_floor_points: numberInput("ruleFloor1F"),
      ground_plus_second_points: numberInput("ruleFloor1F2F"),
      ground_plus_basement_points: numberInput("ruleFloor1FB1"),
      second_floor_points: numberInput("ruleFloor2F")
    }
  };
}

async function saveScoringRules() {
  try {
    const data = await propertyWriteApi("POST", "/api/property-sourcing/scoring-config", readScoringRulesForm());
    scoringConfig = data.scoringConfig;
    await loadLocations();
    renderScoringRules();
    alert("評分規則已儲存，人工與自動物件已重新計算");
  } catch (err) {
    alert(err.message || "儲存失敗");
  }
}

async function resetScoringRules() {
  if (!confirm("要重設為預設評分規則嗎？")) return;
  try {
    const data = await propertyWriteApi("POST", "/api/property-sourcing/scoring-config", { reset: true });
    scoringConfig = data.scoringConfig;
    await loadLocations();
    renderScoringRules();
    alert("評分規則已重設，人工與自動物件已重新計算");
  } catch (err) {
    alert(err.message || "重設失敗");
  }
}

wireSourceTabs();
loadLocations();
</script>
</body>
</html>
