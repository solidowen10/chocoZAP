<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>591 Radar</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f7f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        margin: 0;
        padding: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .badge {
        border: 1px solid #d8dde5;
        border-radius: 999px;
        padding: 3px 8px;
        color: #54606f;
        font-size: 11px;
        background: #fff;
      }

      button {
        border: 1px solid #cfd6df;
        border-radius: 8px;
        padding: 9px 11px;
        background: #fff;
        color: #17202a;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #f0f4f8;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #scanButton {
        width: 100%;
        border-color: #2f6fed;
        background: #2f6fed;
        color: #fff;
      }

      #scanButton:hover {
        background: #255fd0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .stat {
        min-width: 0;
        border: 1px solid #dde3ea;
        border-radius: 8px;
        padding: 9px;
        background: #fff;
      }

      .label {
        color: #647282;
        font-size: 11px;
        line-height: 1.2;
      }

      .value {
        margin-top: 5px;
        font-size: 20px;
        font-weight: 750;
        line-height: 1;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      .sheet-box {
        border: 1px solid #dde3ea;
        border-radius: 8px;
        padding: 10px;
        margin: 12px 0;
        background: #fff;
      }

      .sheet-box label {
        display: block;
        margin-bottom: 4px;
        color: #647282;
        font-size: 11px;
        font-weight: 650;
      }

      .sheet-box input {
        width: 100%;
        border: 1px solid #d5dce5;
        border-radius: 7px;
        padding: 8px;
        color: #1f2933;
        font: inherit;
        font-size: 12px;
      }

      .sheet-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      #sendSheetButton {
        width: 100%;
        margin-top: 9px;
        border-color: #159947;
        background: #159947;
        color: #fff;
      }

      #sendSheetButton:hover {
        background: #0f7d38;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        border: 1px solid #d5dce5;
        border-radius: 8px;
        padding: 10px;
        background: #fff;
        color: #1f2933;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
      }

      .status {
        min-height: 18px;
        margin: 10px 0;
        color: #54606f;
        font-size: 12px;
      }

      .status.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>591 Radar</h1>
      <span class="badge">Stage 2 POC</span>
    </header>

    <button id="scanButton" type="button">Scan Current Page</button>

    <div class="stats" aria-live="polite">
      <div class="stat">
        <div class="label">Found Listings</div>
        <div class="value" id="foundCount">0</div>
      </div>
      <div class="stat">
        <div class="label">Parsed Successfully</div>
        <div class="value" id="parsedCount">0</div>
      </div>
      <div class="stat">
        <div class="label">Failed</div>
        <div class="value" id="failedCount">0</div>
      </div>
    </div>

    <div class="actions">
      <button id="copyButton" type="button" disabled>Copy JSON</button>
      <button id="downloadButton" type="button" disabled>Download JSON</button>
    </div>

    <div class="sheet-box">
      <div class="sheet-grid">
        <div>
          <label for="sheetWebhookUrl">Google Sheet Webhook URL</label>
          <input id="sheetWebhookUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <div>
          <label for="sheetSecret">Shared Secret</label>
          <input id="sheetSecret" type="password" placeholder="Optional, if Apps Script checks it" />
        </div>
      </div>
      <button id="sendSheetButton" type="button" disabled>Send to Google Sheet</button>
    </div>

    <div id="status" class="status">Open a 591 search results page, then scan.</div>
    <textarea id="jsonOutput" spellcheck="false" readonly></textarea>

    <script src="popup.js"></script>
  </body>
</html>
